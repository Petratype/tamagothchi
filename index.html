<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tamagothchi Ghost</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>
<body>
  <!-- Overlay at start -->
  <div id="startOverlay" class="overlay">
    <h1>Tamagothchi 👻</h1>
    <button id="startBtn">Start Game</button>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <span id="hunger-label">Hunger</span>
      <div class="bar"><div id="hunger-fill" class="fill"></div></div>
    </div>
    <div class="stat">
      <span id="happiness-label">Happiness</span>
      <div class="bar"><div id="happiness-fill" class="fill"></div></div>
    </div>
    <div class="stat">
      <span id="energy-label">Energy</span>
      <div class="bar"><div id="energy-fill" class="fill"></div></div>
    </div>
  </div>

  <!-- Pet -->
  <div class="pet-container">
    <img id="pet" src="baby-ghost-mov.gif" alt="Baby Ghost">
    <span id="pauseSymbol" class="pause-symbol">paused</span>
  </div>

  <!-- Controls (center bottom) -->
  <div id="controls" class="controls">
    <button id="feedBtn">Feed</button>
    <button id="playBtn">Play</button>
    <button id="sleepBtn">Sleep</button>
  </div>

  <!-- Restart (hidden until needed) -->
  <div id="restart" class="restart">
    <button id="restartBtn">Revive Goth</button>
  </div>

  <!-- Top-right column (music / effects) -->
  <div class="right-column top-right">
    <button id="musicBtn" class="corner-button">♪ Music: On</button>
    <button id="effectsBtn" class="corner-button">🔊 Effects: On</button>
  </div>

  <!-- Bottom-right column (pause) -->
  <div class="right-column bottom-right">
    <button id="pauseBtn" class="corner-button">Pause</button>
  </div>

  <!-- Status -->
  <p id="status" class="status">Press start to summon your goth 👻</p>
  <p id="hint" class="hint">Tip: keep stats balanced to win a ghost rave!</p>

  <script src="script.js"></script>
</body>
</html>
